name: Build and test macOS

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check Actions with actionlint
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  macos:
    needs: lint
    name: macOS / ${{ matrix.release_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            node_arch: arm64
            release_arch: arm64
          - runner: macos-15-intel
            node_arch: x64
            release_arch: x86_64
    env:
      CI: "true"
      BUILD_ARCH: ${{ matrix.node_arch }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --force

      - name: Validate app version
        run: node scripts/bumpversion.cjs --check

      - name: Install UI dependencies
        run: yarn --cwd keycraft install --frozen-lockfile --ignore-optional --ignore-scripts --non-interactive

      - name: Install app dependencies
        run: npm --prefix desktop ci
        env:
          # Packaging downloads its own runtime; tests launch the packaged app.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run unit and UI tests
        run: npm test

      - name: Build macOS app
        run: npm run package:mac

      - name: Test packaged app
        id: app-test
        timeout-minutes: 10
        run: npm --prefix desktop run test:app

      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/desktop/keycraft-darwin-${BUILD_ARCH}/keycraft.app"

      - name: Create ZIP, DMG and checksums from tested app
        run: bash scripts/archive-macos.sh

      - name: Upload verified installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Keycraft-macos-${{ matrix.release_arch }}
          path: |
            dist/desktop/Keycraft-*-macos-${{ matrix.release_arch }}.zip
            dist/desktop/Keycraft-*-macos-${{ matrix.release_arch }}.dmg
            dist/desktop/Keycraft-*-macos-${{ matrix.release_arch }}.*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test screenshots
        if: ${{ always() && steps.app-test.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-screenshots-macos-${{ matrix.release_arch }}
          path: dist/desktop/screenshots/
          if-no-files-found: ignore
          retention-days: 7
