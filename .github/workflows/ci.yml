name: Test, build and release

on:
  push:
    branches: ['**']
    tags: ['v*.*.*-rc.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      CI: "true"
      BUILD_ARCH: ${{ matrix.arch }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --force

      - name: Validate app version
        run: node scripts/bumpversion.cjs --check

      - name: Validate release tag
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/bumpversion.cjs --check "$GITHUB_REF_NAME"

      - name: Install UI dependencies
        run: yarn --cwd keycraft install --frozen-lockfile --ignore-optional --ignore-scripts --non-interactive

      - name: Install app dependencies
        run: npm --prefix desktop ci
        env:
          # Packaging downloads its own runtime; tests launch the packaged app.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run unit and UI tests
        run: npm test

      - name: Build macOS app
        run: npm run package:mac

      - name: Test packaged app
        id: app-test
        timeout-minutes: 10
        run: npm --prefix desktop run test:app

      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/desktop/keycraft-darwin-${BUILD_ARCH}/keycraft.app"

      - name: Create ZIP, DMG and checksums from tested app
        run: bash scripts/archive-macos.sh

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keycraft-macos-${{ matrix.arch }}
          path: |
            dist/desktop/keycraft-*-macos-${{ matrix.arch }}.zip
            dist/desktop/keycraft-*-macos-${{ matrix.arch }}.dmg
            dist/desktop/keycraft-*-macos-${{ matrix.arch }}.*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test screenshots
        if: ${{ always() && steps.app-test.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-screenshots-macos-${{ matrix.arch }}
          path: dist/desktop/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release candidate
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download tested apps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: keycraft-macos-*
          merge-multiple: true
          path: release-assets

      - name: Verify downloads and publish prerelease
        run: bash scripts/publish-release.sh
